name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc-13
            cxx: g++-13
          - os: ubuntu-latest
            cc: clang-17
            cxx: clang++-17
          - os: macos-latest
            cc: clang
            cxx: clang++

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build gcc-13 g++-13 libluajit-5.1-dev wget

      - name: Install Clang 17 (Ubuntu)
        if: runner.os == 'Linux' && matrix.cc == 'clang-17'
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 17

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install cmake ninja luajit

      - name: Configure
        run: >-
          cmake -S . -B build
          -G Ninja
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DULUA_BUILD_EXAMPLES=ON
          -DULUA_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install
        run: cmake --install build --prefix "$RUNNER_TEMP/ulua-install"

  ffi-private-headers:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build gcc-13 g++-13 git make

      - name: Clone and build LuaJIT source tree
        run: |
          git clone --depth 1 --branch v2.1 https://github.com/LuaJIT/LuaJIT.git LuaJIT-src
          make -C LuaJIT-src/src CC=gcc-13

      - name: Configure with LuaJIT private headers
        run: >-
          cmake -S . -B build-ffi
          -G Ninja
          -DCMAKE_C_COMPILER=gcc-13
          -DCMAKE_CXX_COMPILER=g++-13
          -DULUA_SUPPORTED_LUA_PROVIDER=LuaJIT
          -DLuaJIT_INCLUDE_DIR=${{ github.workspace }}/LuaJIT-src/src
          -DLuaJIT_LIBRARY=${{ github.workspace }}/LuaJIT-src/src/libluajit.a
          -DULUA_BUILD_EXAMPLES=OFF
          -DULUA_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-ffi --parallel

      - name: Test
        run: ctest --test-dir build-ffi --output-on-failure
